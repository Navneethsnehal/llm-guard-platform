[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-guard-platform"
version = "0.1.0"
description = "Production LLM gateway with routing, guardrails, red-teaming, eval-gated releases, and observability."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navneeth Jadav" }]
keywords = ["llm", "gateway", "guardrails", "evals", "llmops", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=2.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "prometheus-client>=0.21",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "redis>=5.2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = [
  "hypothesis>=6.115",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff==0.17.1",
  "types-PyYAML",
]

[project.scripts]
llm-guard = "llm_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Navneethsnehal/llm-guard-platform"
Documentation = "https://github.com/Navneethsnehal/llm-guard-platform/blob/main/docs/architecture.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guard"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "ui", "benchmarks"]
extend-exclude = [".venv", "var", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PIE", "RET"]
ignore = [
  "RET504",
  # Provider methods take a caller-supplied budget and pass it to httpx.
  # ASYNC109 assumes the parameter should become asyncio.timeout instead.
  "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm_guard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_guard"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "redis.*", "redis.asyncio.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=llm_guard --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["llm_guard"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 85
